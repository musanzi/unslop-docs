name: unslop-docs
services:
  api:
    build:
      context: .
      target: api-production
      network: host
      entitlements:
        - network.host
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URI: ${FRONTEND_URI}
      UPLOADS_DIR: /app/apps/api/uploads
      DOCUMENTS_DIR: /app/private-documents
    ports:
      - ${API_PORT:-8000}:${API_PORT}
    volumes:
      - uploads_data:/app/apps/api/uploads
      - documents_data:/app/private-documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      target: api-production
      network: host
      entitlements:
        - network.host
    command: ['node', 'dist/apps/api/src/worker.js']
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      ASSESSMENT_TIMEOUT_MS: ${ASSESSMENT_TIMEOUT_MS:-300000}
      PROCESSING_TIMEOUT_MS: ${PROCESSING_TIMEOUT_MS:-900000}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-60000}
      UPLOADS_DIR: /app/apps/api/uploads
      DOCUMENTS_DIR: /app/private-documents
    volumes:
      - documents_data:/app/private-documents
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web-production
      network: host
      entitlements:
        - network.host
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-4200}
    ports:
      - ${WEB_PORT:-4200}:${WEB_PORT}
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  documents_data:
