<div class="flex flex-col gap-1 border-t border-divider pt-3">
  <button
    class="ui-sidebar-item w-full text-left"
    type="button"
    (click)="profile.open()"
    [disabled]="auth.isSigningOut()"
    [attr.aria-label]="subscription() ? 'Edit profile, ' + subscription()?.name + ' subscription' : 'Edit profile'">
    <img class="size-8 shrink-0 rounded-full object-cover" [src]="avatarImageUrl()" alt="" />
    <span class="min-w-0 flex-1"
      ><span class="block truncate text-ink">{{ auth.user()?.name }}</span
      ><span class="block truncate text-[0.75rem] font-normal text-muted">{{ auth.user()?.email }}</span>
      @if (subscription(); as plan) {
        <span
          class="mt-1.5 inline-flex items-center gap-1.5 text-[0.75rem] font-normal text-muted"
          [attr.aria-label]="plan.name + ' subscription'">
          <mat-icon [svgIcon]="plan.icon" />{{ plan.name }}
        </span>
      }
    </span>
    <mat-icon svgIcon="settings-2" />
  </button>
  <button
    class="ui-sidebar-item ui-logout w-full"
    type="button"
    [disabled]="auth.isSigningOut()"
    (click)="auth.signOut()">
    <mat-icon svgIcon="log-out" />{{ auth.isSigningOut() ? 'Signing out...' : 'Sign out' }}
  </button>
  @if (auth.signOutError()) {
    <p class="px-2 text-[0.8125rem] text-danger" role="alert">{{ auth.signOutError() }}</p>
  }
</div>
