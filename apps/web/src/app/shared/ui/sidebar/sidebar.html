<div class="flex h-full min-h-0 flex-col bg-canvas p-3 text-ink">
  <a
    routerLink="/documents"
    class="mx-2 mb-8 mt-3 flex min-h-11 items-center gap-2.5 rounded-lg text-[1.125rem] font-medium"
    aria-label="Unslopy documents"
    ><img src="/brand/unslopy-mark.svg" width="28" height="28" alt="" />Unslopy</a
  >
  <nav class="flex flex-1 flex-col gap-1" aria-label="Administration">
    <a
      class="ui-sidebar-item"
      routerLink="/admin"
      routerLinkActive="bg-hover text-ink"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      ><mat-icon svgIcon="layout-dashboard" />Overview</a
    >
    <a
      class="ui-sidebar-item"
      routerLink="/admin/users"
      routerLinkActive="bg-hover text-ink"
      ariaCurrentWhenActive="page"
      ><mat-icon svgIcon="users" />Users</a
    >
    <a class="ui-sidebar-item mt-5" routerLink="/documents"><mat-icon svgIcon="files" />My documents</a>
  </nav>
  <user />
</div>
