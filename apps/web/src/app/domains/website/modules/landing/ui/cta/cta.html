<section id="get-started" class="scroll-mt-24 bg-white py-20">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div
      class="flex flex-col items-start justify-between gap-8 border-t border-neutral-200 pt-12 md:flex-row md:items-center">
      <div class="max-w-2xl">
        <h2 class="text-4xl font-bold text-neutral-950">Set up your student account</h2>
        <p class="mt-4 text-xl leading-7 text-neutral-600">
          Sign in with Google to manage your profile. Document uploads and editing are not available yet.
        </p>
      </div>

      @if (isAuthenticated()) {
        <a matButton="filled" routerLink="/user/profile">
          Open my profile
          <mat-icon class="ml-2 size-4" svgIcon="arrow-right" />
        </a>
      } @else {
        <a matButton="filled" routerLink="/auth/sign-in">
          Sign in with Google
          <mat-icon class="ml-2 size-4" svgIcon="arrow-right" />
        </a>
      }
    </div>
  </div>
</section>
