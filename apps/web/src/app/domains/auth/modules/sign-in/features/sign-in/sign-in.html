<div
  class="flex min-h-svh flex-col bg-canvas font-interface text-[1rem] text-ink scheme-dark [font-synthesis:none] selection:bg-paper-pressed selection:text-canvas [&_a:focus-visible]:outline-2 [&_a:focus-visible]:outline-offset-[5px] [&_a:focus-visible]:outline-ink">
  <a
    href="#main-content"
    class="absolute left-4 top-4 z-10 -translate-y-[200%] rounded-lg bg-ink p-3 text-canvas focus:translate-y-0"
    >Skip to main content</a
  >
  <header class="px-6 pt-8 text-center">
    <a
      routerLink="/"
      class="inline-flex items-center gap-2.5 font-editorial text-[1.75rem] font-medium leading-[1.3] text-inherit no-underline"
      aria-label="Unslopy home">
      <img class="shrink-0" src="/brand/unslopy-mark.svg" width="32" height="32" alt="" />
      <span>Unslopy</span>
    </a>
  </header>
  <main
    id="main-content"
    tabindex="-1"
    class="grid flex-1 place-items-center px-6 pb-28 pt-12 [@media(max-height:32rem)]:py-8">
    <div class="w-full max-w-xl text-center">
      <h1
        class="m-0 text-balance font-editorial text-[clamp(2rem,4vw,3rem)] font-normal leading-[1.2] tracking-[-0.025em]">
        Humanize your AI generated documents.
      </h1>
      <p class="mt-3.5 text-balance leading-[1.6] text-muted">Keep your ideas. Lose the robotic tone.</p>
      <div class="mx-auto mt-7 max-w-[23rem] rounded-2xl border border-hover bg-panel p-5">
        @if (message) {
          <p role="alert" class="mb-4 text-left text-[0.875rem] leading-[1.6]">{{ message }}</p>
        }
        <a
          class="flex min-h-12 items-center justify-center gap-2.5 rounded-lg bg-ink px-3 py-3 font-medium leading-[1.5] text-canvas no-underline hover:bg-white active:bg-paper-pressed"
          [href]="googleSignInUrl">
          <img src="/brand/google-g.png" width="200" height="204" class="h-5 w-auto shrink-0" alt="" />
          <span>Continue with Google</span>
        </a>
      </div>
    </div>
  </main>
</div>
