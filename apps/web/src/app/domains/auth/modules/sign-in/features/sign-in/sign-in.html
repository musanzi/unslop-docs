<div class="mx-auto flex w-full max-w-96 flex-col sm:min-w-80">
  <a href="/" class="mb-4 inline-flex items-center self-start text-sm font-medium text-primary-700 hover:underline">
    <mat-icon class="mr-1 size-4" svgIcon="arrow-left" />
    Back home
  </a>
  <h1 class="text-4xl leading-tight font-extrabold tracking-tight">Sign in</h1>
  <p class="mt-3 text-on-surface-variant">Use your Google account to sign in or create an account.</p>
  @if (message) {
    <p role="alert" class="mt-4 rounded border p-3 text-sm">{{ message }}</p>
  }
  <a matButton="filled" class="mt-8 w-full" [href]="googleSignInUrl">Continue with Google</a>
</div>
