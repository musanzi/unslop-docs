<div class="entry-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <a routerLink="/" class="wordmark" aria-label="unslop-docs home">unslop-docs</a>
  </header>
  <main id="main-content" tabindex="-1">
    <div class="entry-content">
      <h1>Make your writing clearer.</h1>
      <p class="description">Document editing for students. Coming soon.</p>
      <div class="sign-in-panel">
        @if (message) {
          <p role="alert" class="sign-in-error">{{ message }}</p>
        }
        @if (authStore.user()) {
          <a class="sign-in-button" routerLink="/auth/sign-in">Continue</a>
        } @else {
          <a class="sign-in-button" [href]="googleSignInUrl">Continue with Google</a>
        }
      </div>
    </div>
  </main>
</div>
