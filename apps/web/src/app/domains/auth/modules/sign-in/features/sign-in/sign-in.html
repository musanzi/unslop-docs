<div class="entry-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <a routerLink="/" class="wordmark" aria-label="Unslopy home">
      <img src="/brand/unslopy-mark.svg" width="32" height="32" alt="" />
      <span>Unslopy</span>
    </a>
  </header>
  <main id="main-content" tabindex="-1">
    <div class="entry-content">
      <h1>Humanize your AI generated documents.</h1>
      <p class="description">Keep your ideas. Lose the robotic tone.</p>
      <div class="sign-in-panel">
        @if (message) {
          <p role="alert" class="sign-in-error">{{ message }}</p>
        }
        @if (authStore.user()) {
          <a class="sign-in-button" routerLink="/auth/sign-in">Continue</a>
        } @else {
          <a class="sign-in-button" [href]="googleSignInUrl">Continue with Google</a>
        }
      </div>
    </div>
  </main>
</div>
